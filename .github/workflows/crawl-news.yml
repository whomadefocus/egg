name: Crawl and embed news

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache Gemma model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: embeddinggemma-300m-v1

      - name: Install worker dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify Hugging Face token is configured
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [[ -z "$HF_TOKEN" ]]; then
            echo "::error::HF_TOKEN is empty. Accept access to google/embeddinggemma-300m on Hugging Face and add a read token as the HF_TOKEN repository secret."
            exit 1
          fi

      - name: Crawl RSS feeds and process embedding jobs
        env:
          NEWS_API_URL: ${{ secrets.NEWS_API_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          EMBEDDING_MODEL: google/embeddinggemma-300m
          ARTICLE_FETCH_WORKERS: "6"
          WORKER_RUN_SECONDS: "2400"
          POLL_INTERVAL_SECONDS: "20"
          CRAWL_INTERVAL_SECONDS: "900"
          PYTHONUNBUFFERED: "1"
        run: python worker.py